<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept C "jd ring": a lowercase jd monogram whose d bowl is the fit-score ring. -->
  <defs>
    <linearGradient id="t" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7178F5"/><stop offset=".55" stop-color="#4F46E5"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="hl" cx="30" cy="16" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#t)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#hl)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
  <!-- j -->
  <circle cx="38" cy="38" r="6.5" fill="#fff"/>
  <path d="M38 54v30a12 12 0 0 1-12 12" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <!-- d: ascender + score ring bowl -->
  <path d="M96 30v52" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <circle cx="74" cy="72" r="16" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="10"/>
  <circle cx="74" cy="72" r="16" fill="none" stroke="#6EE7B7" stroke-width="10" stroke-linecap="round" stroke-dasharray="78 101" transform="rotate(-90 74 72)"/>
</svg>
