<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept B "Signal": bold gradient tile, a white job card cut by a rising fit bar chart. -->
  <defs>
    <linearGradient id="t" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#4F46E5"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="hl" cx="34" cy="20" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="96" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#t)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#hl)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
  <rect x="32" y="74" width="16" height="22" rx="5" fill="#fff" fill-opacity=".55"/>
  <rect x="56" y="58" width="16" height="38" rx="5" fill="#fff" fill-opacity=".8"/>
  <rect x="80" y="38" width="16" height="58" rx="5" fill="url(#bar)"/>
  <circle cx="88" cy="28" r="5" fill="#fff"/>
</svg>
